<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRONOS V17 | Quantum Sovereign</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #00f2ff;
    --gold:    #d4af37;
    --bg:      #050a14;
    --quantum: #bd00ff;
  }
  body {
    background: var(--bg);
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    margin: 0;
    text-align: center;
  }
  header {
    padding: 50px;
    border-bottom: 1px solid var(--primary);
    background: linear-gradient(to bottom, #0a1a1e, transparent);
  }
  .logo {
    width: 120px;
    filter: drop-shadow(0 0 15px var(--primary));
  }
  .mando-panel {
    max-width: 800px;
    margin: 40px auto;
    background: rgba(10,25,47,0.9);
    padding: 30px;
    border-left: 5px solid var(--primary);
    border-radius: 4px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  input {
    width: 80%;
    padding: 15px;
    background: #000;
    border: 1px solid var(--primary);
    color: var(--primary);
    font-size: 1.2em;
    margin-bottom: 10px;
  }
  button {
    width: 80%;
    padding: 15px;
    background: var(--primary);
    color: #000;
    border: none;
    font-weight: bold;
    cursor: pointer;
    text-transform: uppercase;
  }
  #resultado {
    display: none;
    margin-top: 30px;
    background: linear-gradient(145deg, #1a1a1a, #000);
    border: 1px solid var(--gold);
    padding: 20px;
    border-radius: 15px;
    position: relative;
  }
  .pulse {
    width: 10px;
    height: 10px;
    background: #10B981;
    border-radius: 50%;
    display: inline-block;
    animation: p 2s infinite;
  }
  @keyframes p {
    0%   { opacity: 1;   }
    50%  { opacity: 0.3; }
    100% { opacity: 1;   }
  }
</style>
</head>
<body>
  <header>
    <img src="logo_ojo.png" alt="Kronos Seal" class="logo">
    <h1 style="color:var(--primary)">KRONOS PROTOCOL V17</h1>
    <p style="color:var(--gold)">ARQUITECTO: MARCO ANTONIO ROJAS VALDOVINOS</p>
  </header>

  <div class="mando-panel">
    <h3>VERIFICADOR PERIMETRAL CUÁNTICO</h3>
    <input type="text" id="folio" placeholder="INGRESE FOLIO FVD-XXXXX">
    <button onclick="ejecutarDictamen()">EJECUTAR ESCANEO</button>

    <div id="resultado">
      <div style="color:var(--gold); font-size:0.7em; letter-spacing:5px;">KRONOS PRIVATE</div>
      <h2 style="color:#10B981"><span class="pulse"></span> VERDE 0 • ACTIVO</h2>
      <p id="q-status" style="color:var(--quantum); font-size:0.8em;"></p>
      <p style="font-size:0.6em; opacity:0.5;">
        HASH: 34c6e0182ce35b3bfb24f88261746a689f5009a0a5260f128be06989b29d34dc
      </p>
    </div>
  </div>

  <script>
    function ejecutarDictamen() {
      document.getElementById('resultado').style.display = 'block';
      const q = document.getElementById('q-status');
      q.innerHTML = "&gt; INICIANDO RECONSTRUCCIÓN DE RETICULADO (KYBER)...";
      setTimeout(() => {
        q.innerHTML = "INTEGRIDAD CUÁNTICA: NIST-L5 PROTECTED";
      }, 1500);
    }
  </script>
</body>
</html>

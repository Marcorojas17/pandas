// ═══════════════════════════════════════════════════════════════════
// CONFIGURACIÓN · URL a codificar
// ═══════════════════════════════════════════════════════════════════
const TARGET_URL = "https://narcorojas17.github.io/verificador.html";
const SIZE = 300;

// Generar QR
const qr = QR(0, 2); // typeNumber 0 = auto, ECC level 2 (M)
qr.addData(TARGET_URL);
qr.make();

const N = qr.getModuleCount();
const cell = SIZE / N;

// Render en canvas
const canvas = document.createElement("canvas");
canvas.width  = SIZE;
canvas.height = SIZE;
const ctx = canvas.getContext("2d");
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, SIZE, SIZE);
ctx.fillStyle = "#000000";
for (let r = 0; r < N; r++) {
  for (let c = 0; c < N; c++) {
    if (qr.isDark(r, c)) {
      ctx.fillRect(Math.floor(c*cell), Math.floor(r*cell),
                   Math.ceil(cell), Math.ceil(cell));
    }
  }
}
document.getElementById("qrbox").appendChild(canvas);
document.getElementById("url").textContent = TARGET_URL;

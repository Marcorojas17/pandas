<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRONOS · Código QR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23050a14' stroke='%2300f2ff' stroke-width='4'/><circle cx='50' cy='50' r='18' fill='%2300f2ff'/></svg>">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { background:#050a14; color:#fff; font-family:'JetBrains Mono',monospace;
         margin:0; min-height:100vh; display:flex; align-items:center;
         justify-content:center; padding:20px; text-align:center; }
  .panel { max-width:600px; width:100%; background:rgba(10,25,47,.95);
           padding:30px; border-left:5px solid #00f2ff; border-radius:4px;
           box-shadow:0 20px 50px rgba(0,0,0,.6); }
  h2 { color:#fff; letter-spacing:2px; margin:0 0 20px; }
  #qrbox { background:#fff; padding:20px; border-radius:10px;
           display:inline-block; margin:20px auto;
           box-shadow:0 0 30px rgba(0,242,255,.5); }
  #qrbox canvas { display:block; width:320px; height:320px; max-width:100%; }
  .url { font-size:.65em; color:#00f2ff; word-break:break-all; margin-top:15px; }
  button { width:100%; padding:15px; background:#00f2ff; color:#000;
           border:none; font-weight:bold; cursor:pointer;
           text-transform:uppercase; font-family:inherit; letter-spacing:3px;
           border-radius:4px; margin-top:15px; }
  button:hover { background:#d4af37; }
  .back { margin-top:20px; font-size:.7em; color:#555; }
  .back a { color:#00f2ff; text-decoration:none; }
</style>
</head>
<body>
<main class="panel">
  <h2>KRONOS · CÓDIGO QR</h2>

  <div id="qrbox"><canvas id="cv"></canvas></div>

  <p class="url">https://narcorojas17.github.io/verificador.html</p>
  <button id="dl">DESCARGAR PNG</button>
  <p class="back"><a href="index.html">← volver al inicio</a></p>
</main>

<script>
const URL_VERIF = "https://narcorojas17.github.io/verificador.html";
const SIZE = 600;
const cv = document.getElementById("cv");
cv.width = SIZE;
cv.height = SIZE;
const ctx = cv.getContext("2d");

// Cargar QR base con ECC nivel H (máxima corrección)
const img = new Image();
img.crossOrigin = "anonymous";
img.src = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&ecc=H&data="
        + encodeURIComponent(URL_VERIF);

img.onload = () => {
  ctx.drawImage(img, 0, 0, SIZE, SIZE);
  dibujarOjo();
};

img.onerror = () => {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = "#000";
  ctx.font = "20px JetBrains Mono, monospace";
  ctx.textAlign = "center";
  ctx.fillText("Error al cargar QR", SIZE/2, SIZE/2);
};

function dibujarOjo() {
  const cx = SIZE / 2;
  const cy = SIZE / 2;
  const R  = SIZE * 0.11; // 11% del tamaño total — seguro con ECC H

  // Círculo base negro
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fill();

  // Anillo cyan
  ctx.strokeStyle = "#00f2ff";
  ctx.lineWidth = R * 0.14;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.78, 0, Math.PI * 2);
  ctx.stroke();

  // Iris morado
  ctx.fillStyle = "#bd00ff";
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.42, 0, Math.PI * 2);
  ctx.fill();

  // Pupila negra
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.20, 0, Math.PI * 2);
  ctx.fill();

  // Brillo cyan
  ctx.fillStyle = "#00f2ff";
  ctx.beginPath();
  ctx.arc(cx - R*0.15, cy - R*0.15, R*0.10, 0, Math.PI * 2);
  ctx.fill();
}

document.getElementById("dl").addEventListener("click", () => {
  if (!img.complete) { alert("Espera a que cargue el QR."); return; }
  const a = document.createElement("a");
  a.download = "kronos-qr-eye.png";
  a.href = cv.toDataURL("image/png");
  a.click();
});
</script>
</body>
</html>

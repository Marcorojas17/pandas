// ═══ CONFIGURACIÓN ═══
const TARGET_URL = "https://narcorojas17.github.io/verificador.html";
const SIZE = 300;

// Type 4, ECC level 1 (L) → suficiente para URLs
const qr = QR(4, 1);
qr.addData(TARGET_URL);
qr.make();

const N = qr.getModuleCount();
const cell = SIZE / N;

// Render en canvas
const canvas = document.createElement("canvas");
canvas.width = SIZE;
canvas.height = SIZE;
const ctx = canvas.getContext("2d");
ctx.fillStyle = "#ffffff";
ctx.fillRect(0, 0, SIZE, SIZE);
ctx.fillStyle = "#000000";
for (let r = 0; r < N; r++) {
  for (let c = 0; c < N; c++) {
    if (qr.isDark(r, c)) {
      ctx.fillRect(Math.round(c*cell), Math.round(r*cell),
                   Math.ceil(cell), Math.ceil(cell));
    }
  }
}
document.getElementById("qrbox").appendChild(canvas);
document.getElementById("url").textContent = TARGET_URL;

// Descargar PNG
document.getElementById("dl").addEventListener("click", () => {
  const a = document.createElement("a");
  a.download = "kronos-qr.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
});
